name: CI-CD Databricks

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Databricks CLI v2
        run: pip install databricks-cli==0.18.0

      - name: Configure Databricks CLI
        run: |
          export DATABRICKS_HOST=${{ secrets.DATABRICKS_HOST }}
          export DATABRICKS_TOKEN=${{ secrets.DATABRICKS_TOKEN }}

      - name: Sync Repo to Databricks
        run: |
          databricks repos update \
            --path "${{ secrets.DATABRICKS_REPO_PATH }}" \
            --branch main

      - name: Trigger Batch Job
        run: |
          databricks jobs run-now --job-id ${{ secrets.DATABRICKS_BATCH_JOB_ID }}

