name: CI-CD Databricks

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-to-databricks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Databricks CLI
        run: pip install databricks-cli

      - name: Configure Databricks CLI
        run: |
          databricks configure --token <<EOF
          ${{ secrets.DATABRICKS_HOST }}
          ${{ secrets.DATABRICKS_TOKEN }}
          EOF

      - name: Sync GitHub → Databricks Repos
        run: |
          databricks repos update \
            --path "${{ secrets.DATABRICKS_REPO_PATH }}" \
            --branch main

      - name: Trigger Batch Pipeline
        run: |
          databricks jobs run-now --job-id 12345

      - name: Trigger Streaming Pipeline
        run: |
          databricks jobs run-now --job-id 67890

      - name: Trigger ML Pipeline
        run: |
          databricks jobs run-now --job-id 54321
